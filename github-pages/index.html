<!DOCTYPE html>
<!--
  Served at https://vercuski.github.io/ (deployed by the github-pages job
  in .github/workflows/deploy.yml). GitHub Pages can't be turned off for a
  <username>.github.io repo or send real 301s to a domain hosted elsewhere,
  so this sends visitors and search engines to the real site, which
  Netlify serves at scott.vercuski.com. An immediate meta refresh is
  treated by Google as a permanent redirect.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=https://scott.vercuski.com/" />
  <link rel="canonical" href="https://scott.vercuski.com/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scott Vercuski | Software &amp; Solution Architect</title>
</head>
<body>
  <p>This site has moved to <a href="https://scott.vercuski.com/">scott.vercuski.com</a>.</p>
</body>
</html>
