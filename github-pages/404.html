<!DOCTYPE html>
<!--
  GitHub Pages serves this, with status 404, for every path on
  vercuski.github.io other than the root (see index.html beside it). The
  404 keeps those paths out of search indexes; the script sends visitors
  to the same path on the real site.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moved | Scott Vercuski</title>
  <script>
    location.replace('https://scott.vercuski.com' + location.pathname + location.search + location.hash)
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://scott.vercuski.com/">scott.vercuski.com</a>.</p>
</body>
</html>
