<!doctype html>
<!--
  Template for the 1200x630 social card images (og:image) in
  public/images/og/. Rendered by generate.mjs, which passes the card's
  text in the query string: ?eyebrow=...&title=...&tagline=...
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=block" rel="stylesheet" />
  <style>
    /* Site theme colors (src/plugins/vuetify.ts). */
    :root { --primary: #6966DB; --secondary: #66627A; }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: Roboto, 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 92% 8%, rgba(105, 102, 219, 0.55), transparent 45%),
        linear-gradient(135deg, #4b4860 0%, var(--secondary) 55%, #57536b 100%);
      display: flex;
      flex-direction: column;
      padding: 72px 80px 64px;
    }
    .eyebrow {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d9d8ff;
    }
    .eyebrow::before {
      content: '';
      display: inline-block;
      width: 48px;
      height: 6px;
      margin: 0 20px 6px 0;
      vertical-align: middle;
      border-radius: 3px;
      background: var(--primary);
    }
    h1 {
      margin-top: 28px;
      font-size: 84px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.01em;
      max-width: 1000px;
    }
    .tagline {
      margin-top: 28px;
      font-size: 34px;
      line-height: 1.35;
      color: #ecebf5;
      max-width: 960px;
    }
    footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    footer img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.85);
      object-fit: cover;
    }
    .name { font-size: 32px; font-weight: 700; }
    .url { font-size: 26px; color: #d9d8ff; }
  </style>
</head>
<body>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="tagline" id="tagline"></p>
  <footer>
    <img src="../../public/images/me.jpg" alt="" />
    <div>
      <div class="name">Scott Vercuski</div>
      <div class="url">scott.vercuski.com</div>
    </div>
  </footer>
  <script>
    const params = new URLSearchParams(location.search)
    for (const id of ['eyebrow', 'title', 'tagline']) {
      document.getElementById(id).textContent = params.get(id) ?? ''
    }
  </script>
</body>
</html>
